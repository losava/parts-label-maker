name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 libtcl8.6
      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m py_compile parts_label_app.py make_parts_label.py version.py updater.py
          python -m pytest -q

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 libtcl8.6 libfuse2
      - name: Build Linux packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          bash packaging/linux/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/packages/*
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/PartsLabel-Setup-*.exe
          if-no-files-found: error
